[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemmascript-python"
version = "0.1.0"
description = "Python frontend for LemmaScript: verify type-annotated Python with #@ contracts via Dafny"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100", "dafnyruntimepython==4.11.0", "mypy>=1.10"]

[project.scripts]
lsc-python = "lemmascript_python.cli:main"

[tool.setuptools.packages.find]
include = ["lemmascript_python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "lsc: needs node + the lsc CLI (npm ci at the repository root)",
  "dafny: needs dafny 4.11 on PATH",
]

[tool.mypy]
strict = true
